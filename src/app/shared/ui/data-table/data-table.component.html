<div class="table-wrap">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" aria-label="กำลังโหลดข้อมูล" />
  }

  @if (errorMessage()) {
    <p class="state state-error" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      {{ errorMessage() }}
    </p>
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="rows()">
      @for (column of columns(); track column.key) {
        <ng-container [matColumnDef]="column.key">
          <th mat-header-cell *matHeaderCellDef>{{ column.header }}</th>
          <td mat-cell *matCellDef="let row" [class]="column.cssClass || ''">
            {{ column.cell(row) }}
          </td>
        </ng-container>
      }

      @if (rowActions) {
        <ng-container matColumnDef="__actions">
          <th mat-header-cell *matHeaderCellDef class="actions-col"></th>
          <td mat-cell *matCellDef="let row" class="actions-col">
            <ng-container [ngTemplateOutlet]="rowActions" [ngTemplateOutletContext]="{ $implicit: row }" />
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  @if (!rows().length && !loading() && !errorMessage()) {
    <p class="state state-empty">{{ emptyMessage() }}</p>
  }

  <mat-paginator
    [length]="total()"
    [pageIndex]="page() - 1"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions()"
    [disabled]="loading()"
    (page)="onPage($event)" />
</div>
