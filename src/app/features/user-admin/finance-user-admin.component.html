<section class="grid gap-5">
  <header class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="m-0 mb-1 text-2xl font-bold">ผู้ใช้และสิทธิ์: การเงิน</h1>
      <p class="m-0 max-w-3xl leading-relaxed text-(--muted)">
        แต่งตั้งผู้ดูแลการเงินของหน่วยงาน ให้ออกใบรับรองภาษีและดูเงินเดือนของหน่วยงานที่รับผิดชอบได้
      </p>
    </div>

    <button *hasPermission="'finance_admin.manage'"
            type="button"
            class="btn-base btn-primary"
            (click)="openCreate()">
      แต่งตั้งผู้ดูแลการเงิน
    </button>
  </header>

  <div class="flex flex-wrap items-center gap-2">
    <div class="relative w-full sm:w-96">
      <label for="finance-search" class="sr-only">ค้นหา</label>
      <input id="finance-search"
             type="search"
             autocomplete="off"
             class="field-base"
             placeholder="ค้นด้วยเลขบัตรประชาชน ชื่อ หรืออีเมล"
             [value]="searchText()"
             (input)="onSearchInput($any($event.target).value)"
             (keyup.enter)="onSearch()" />
    </div>

    <button type="button"
            class="btn-base btn-primary"
            (click)="onSearch()">ค้นหา</button>

    @if (searchText()) {
      <button type="button"
              class="btn-base btn-ghost text-(--muted)"
              (click)="onClearSearch()">ล้าง</button>
    }
  </div>

  <app-table
    [columns]="columns"
    [rows]="rows()"
    [total]="total()"
    [page]="page()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    [errorMessage]="errorMessage()"
    emptyMessage="ยังไม่มีผู้ดูแลการเงินในหน่วยงานที่คุณดูแล"
    (pageChange)="onPageChange($event)">

    <ng-template #rowActions let-row>
      <div *hasPermission="'finance_admin.manage'" class="flex justify-end gap-1">
        <button type="button"
                class="btn-base btn-sm btn-ghost"
                (click)="openEdit(row)">แก้ไข</button>
        <button type="button"
                class="btn-base btn-sm btn-danger"
                (click)="confirmDeactivate(row)">ถอนสิทธิ์</button>
      </div>
    </ng-template>
  </app-table>
</section>
